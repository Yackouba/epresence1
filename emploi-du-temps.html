  <div class="layout">

    <!-- ========== BARRE LATÉRALE ========== -->
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">

          <path d="M24 2 2 13l22 11 22-11L24 2Z" fill="#ffffff"/>

          <path d="M43 15v12" stroke="#f5b324" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="43" cy="29" r="2.4" fill="#f5b324"/>

      <nav class="menu">

      <a href="connexion.html" class="menu-logout" id="logout"><svg><use href="#i-logout"/></svg>Déconnexion</a>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- ========== CONTENU ========== -->
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <div class="user" id="user-menu">
          <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="avatar">A</span>
            <span class="user-info">
              <strong id="user-name">Administrateur</strong>
              <small>Admin</small>
            </span>
            <svg class="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dropdown" id="dropdown" hidden>
            <a href="parametres.html">Paramètres</a>
            <a href="connexion.html" id="logout-top">Déconnexion</a>
          </div>
        </div>
      </header>

      <main class="content">
        <h1>Emploi du temps</h1>

        <div class="edt-toolbar">
          <label class="date-btn">
            <svg viewBox="0 0 24 24"><use href="#i-edt"/></svg>
            <span id="date-label">Jeudi 27 mars 2025</span>
            <input type="date" id="date" value="2025-03-27" aria-label="Choisir une date">
          </label>
          <div class="select-box"><select id="classe" aria-label="Classe"></select></div>
          <span class="spacer"></span>
          <button type="button" class="btn-primary" id="btn-add"><svg viewBox="0 0 24 24"><use href="#i-add"/></svg>Ajouter un cours</button>
        </div>

        <section class="card edt" aria-label="Cours de la journée">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Heure</th><th>Cours</th><th>Enseignant</th><th>Salle</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </main>

    </div>
  </div>

  <dialog class="modal" id="dlg" aria-labelledby="dlg-title">
    <form id="form" novalidate>
      <div class="modal-head">
        <h2 id="dlg-title">Ajouter un cours</h2>
        <button type="button" class="modal-close" data-close aria-label="Fermer">×</button>
      </div>
      <p class="modal-sub" id="dlg-sub"></p>
      <div class="form-grid">
        <div class="f"><label for="f-debut">Heure de début</label><input id="f-debut" type="time"></div>
        <div class="f"><label for="f-fin">Heure de fin</label><input id="f-fin" type="time"></div>
        <div class="f full"><label for="f-cours">Cours</label><input id="f-cours" type="text" placeholder="Ex. Réseaux informatiques" autocomplete="off"></div>
        <div class="f"><label for="f-ens">Enseignant</label>
          <input id="f-ens" type="text" list="liste-ens" placeholder="Ex. M. Diallo" autocomplete="off">
          <datalist id="liste-ens"><option value="M. Diallo"><option value="M. Ouédraogo"><option value="Mme Traoré"><option value="M. Koné"></datalist></div>
        <div class="f"><label for="f-salle">Salle</label><input id="f-salle" type="text" placeholder="Ex. Salle 101" autocomplete="off"></div>
      </div>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close>Annuler</button>
        <button type="submit" class="btn-primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="auth.js"></script>
  <script src="etablissement.js"></script>
  <script src="layout.js"></script>
  <script src="emploi-du-temps.js"></script>
</body>
</html>
